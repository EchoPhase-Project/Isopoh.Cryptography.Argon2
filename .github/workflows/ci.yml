name: CI - Build and Test (Release)

on:
  push:
    # echophase-ci is the working CI branch of the EchoPhase fork.
    branches: [ main, echophase-ci ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_tests:
        description: Run the whole managed test suite (Slow included, HighMemory excluded)
        required: false
        type: boolean
        default: false
      run_high_memory_test:
        description: Run only the HighMemory test (needs a runner with more than 32 GiB of RAM, see the HIGH_MEMORY_RUNNER variable)
        required: false
        type: boolean
        default: false

# A new push to a pull request cancels the run for the previous push.
# Pushes (main, echophase-ci) and manual runs are never cancelled: each
# pushed commit that starts keeps its own result. A newer push to the same
# branch waits for the running one; GitHub keeps only the newest waiting run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The fast suite: everything except the >2 GiB test and the timing report.
  # It includes the generated reference vectors, the edge-parameter KATs,
  # the FillBlock kernel cross-check and the leak tests.
  FAST_TEST_FILTER: Category!=HighMemory&Category!=Slow
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y cmake
          choco install -y ninja

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: "Configure CMake (CMake build preset: release)"
        run: cmake --preset release

      - name: Build native reference implementation
        run: cmake --build --preset release-build --target argon2

      # The test vector source generator runs the native reference binary at
      # build time. Point it at the binary explicitly, before any dotnet
      # command starts the compiler server (which keeps its environment).
      - name: Locate native reference binary
        shell: bash
        run: |
          exe="Reference/bin/Release/argon2"
          if [[ "$RUNNER_OS" == "Windows" ]]; then exe="$exe.exe"; fi
          test -f "$exe" || { echo "::error::$exe was not built"; exit 1; }
          echo "REFERENCE_RUN_PATH=$GITHUB_WORKSPACE/$exe" >> "$GITHUB_ENV"

      - name: Show CPU vector extensions (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "AVX2:    $(grep -o -m1 'avx2' /proc/cpuinfo || echo none)"
          echo "AVX-512: $(grep -o -m1 'avx512f' /proc/cpuinfo || echo none)"

      - name: Build .NET 10 libraries with AOT analysis
        run: dotnet build lib/Isopoh.Cryptography.Argon2/Isopoh.Cryptography.Argon2.csproj -c Release -f net10.0 -p:GeneratePackageOnBuild=false

      - name: Run fast test suite
        run: dotnet test test/Isopoh.Cryptography.Test/Isopoh.Cryptography.Test.csproj -c Release --filter "${{ env.FAST_TEST_FILTER }}" -p:GeneratePackageOnBuild=false

      - name: Publish Native AOT smoke test (Linux)
        if: runner.os == 'Linux'
        run: dotnet publish test/AotSmokeTest/AotSmokeTest.csproj -c Release -r linux-x64

      - name: Run Native AOT smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./test/AotSmokeTest/bin/Release/net10.0/linux-x64/publish/AotSmokeTest

      - name: Publish Native AOT smoke test (Windows)
        if: runner.os == 'Windows'
        run: dotnet publish test/AotSmokeTest/AotSmokeTest.csproj -c Release -r win-x64

      - name: Run Native AOT smoke test (Windows)
        if: runner.os == 'Windows'
        run: ./test/AotSmokeTest/bin/Release/net10.0/win-x64/publish/AotSmokeTest.exe

      - name: Select Native AOT runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "$RUNNER_ARCH" == "ARM64" ]]; then
            echo "MACOS_RID=osx-arm64" >> "$GITHUB_ENV"
          else
            echo "MACOS_RID=osx-x64" >> "$GITHUB_ENV"
          fi

      - name: Publish Native AOT smoke test (macOS)
        if: runner.os == 'macOS'
        run: dotnet publish test/AotSmokeTest/AotSmokeTest.csproj -c Release -r ${{ env.MACOS_RID }}

      - name: Run Native AOT smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./test/AotSmokeTest/bin/Release/net10.0/${{ env.MACOS_RID }}/publish/AotSmokeTest

  # Run the fast suite again with some SIMD paths disabled, so that each
  # FillBlock path (AVX-512, AVX2, portable Vector128/scalar) is checked
  # against the reference vectors. The default run in build-and-test covers
  # the best path of the runner. The hardware AVX-512 path runs only on
  # runners whose CPU supports AVX-512 (see the "Show CPU" step); on other
  # runners the AVX-512 kernel test uses the portable Vector512 fallback.
  #
  # Knob names (checked in dotnet/runtime release/9.0 and release/10.0,
  # clrconfigvalues.h): EnableHWIntrinsic, EnableAVX2 and
  # PreferredVectorBitWidth exist in both. The tests run on .NET 9 (net9.0).
  # The AVX-512 enable knob differs (.NET 9: EnableAVX512F, .NET 10:
  # EnableAVX512), so the AVX2 run uses PreferredVectorBitWidth=256 instead:
  # it makes Vector512.IsHardwareAccelerated false, which turns off the
  # AVX-512 FillBlock path (UseAvx512) in both runtimes.
  simd-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: "Configure CMake (CMake build preset: release)"
        run: cmake --preset release

      - name: Build native reference implementation
        run: cmake --build --preset release-build --target argon2

      - name: Locate native reference binary
        run: |
          test -f Reference/bin/Release/argon2
          echo "REFERENCE_RUN_PATH=$GITHUB_WORKSPACE/Reference/bin/Release/argon2" >> "$GITHUB_ENV"

      - name: Show CPU vector extensions
        run: |
          echo "AVX2:    $(grep -o -m1 'avx2' /proc/cpuinfo || echo none)"
          echo "AVX-512: $(grep -o -m1 'avx512f' /proc/cpuinfo || echo none)"

      # Build once without the knobs; the test runs below only set them for
      # the test host.
      - name: Build tests
        run: dotnet build test/Isopoh.Cryptography.Test/Isopoh.Cryptography.Test.csproj -c Release -p:GeneratePackageOnBuild=false

      - name: Fast suite, AVX-512 off (AVX2 path)
        if: ${{ !cancelled() }}
        env:
          DOTNET_PreferredVectorBitWidth: 256
        run: dotnet test test/Isopoh.Cryptography.Test/Isopoh.Cryptography.Test.csproj -c Release --no-build --filter "${{ env.FAST_TEST_FILTER }}"

      - name: Fast suite, AVX2 off (Vector128 path)
        if: ${{ !cancelled() }}
        env:
          DOTNET_EnableAVX2: 0
        run: dotnet test test/Isopoh.Cryptography.Test/Isopoh.Cryptography.Test.csproj -c Release --no-build --filter "${{ env.FAST_TEST_FILTER }}"

      - name: Fast suite, all hardware intrinsics off (scalar path)
        if: ${{ !cancelled() }}
        env:
          DOTNET_EnableHWIntrinsic: 0
        run: dotnet test test/Isopoh.Cryptography.Test/Isopoh.Cryptography.Test.csproj -c Release --no-build --filter "${{ env.FAST_TEST_FILTER }}"

  # The whole managed suite, with the Slow tests (TestParallelismTiming)
  # but without the HighMemory test (see high-memory-test). The test
  # project is the only test project of the repository. The release-test
  # CMake preset runs "dotnet test" without a filter, so this job calls
  # "dotnet test" directly, after the native reference build, as
  # build-and-test does.
  full-managed-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Show runner memory and CPU
        run: |
          free -h
          echo "AVX-512: $(grep -o -m1 'avx512f' /proc/cpuinfo || echo none)"

      - name: "Configure CMake (CMake build preset: release)"
        run: cmake --preset release

      - name: Build native reference implementation
        run: cmake --build --preset release-build --target argon2

      - name: Locate native reference binary
        run: |
          exe="Reference/bin/Release/argon2"
          test -f "$exe" || { echo "::error::$exe was not built"; exit 1; }
          echo "REFERENCE_RUN_PATH=$GITHUB_WORKSPACE/$exe" >> "$GITHUB_ENV"

      - name: Run full managed test suite (HighMemory excluded)
        run: dotnet test test/Isopoh.Cryptography.Test/Isopoh.Cryptography.Test.csproj -c Release --filter "Category!=HighMemory" -p:GeneratePackageOnBuild=false

  # Only TestHighMemoryCost (Category=HighMemory). It hashes with
  # memoryCost = Argon2Memory.CsharpMaxBlocksPerArray + 271 = 16,769,295
  # blocks of 1 KiB (16,769,280 after rounding to 4 * 20 lanes), so one
  # hash needs about 16 GiB of working memory. It then verifies, which
  # allocates another 16 GiB. The first hash's managed blocks stay on the
  # heap until a GC, so the peak can be about 32 GiB. Use a runner with
  # more than 32 GiB of RAM (40 GiB or more recommended). The GitHub-hosted
  # ubuntu-latest runner has 16 GiB and will fail or swap: set the
  # repository variable HIGH_MEMORY_RUNNER to the label of a larger-runner
  # or self-hosted runner before you start this job.
  high-memory-test:
    if: github.event_name == 'workflow_dispatch' && inputs.run_high_memory_test
    runs-on: ${{ vars.HIGH_MEMORY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Show runner memory and CPU
        run: |
          free -h
          echo "AVX-512: $(grep -o -m1 'avx512f' /proc/cpuinfo || echo none)"

      - name: "Configure CMake (CMake build preset: release)"
        run: cmake --preset release

      - name: Build native reference implementation
        run: cmake --build --preset release-build --target argon2

      - name: Locate native reference binary
        run: |
          exe="Reference/bin/Release/argon2"
          test -f "$exe" || { echo "::error::$exe was not built"; exit 1; }
          echo "REFERENCE_RUN_PATH=$GITHUB_WORKSPACE/$exe" >> "$GITHUB_ENV"

      - name: Run HighMemory test
        run: dotnet test test/Isopoh.Cryptography.Test/Isopoh.Cryptography.Test.csproj -c Release --filter "Category=HighMemory" -p:GeneratePackageOnBuild=false
