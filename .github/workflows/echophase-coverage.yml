name: Coverage (EchoPhase fork)

# Lives only on the echophase-ci branch, on top of the patch series in
# echophase, so that branch stays exactly the patches meant for upstream.
# Rebase this branch onto echophase after changing the patches.
on:
  push:
    branches: [ echophase-ci ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Codecov upload with OIDC, no token

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # The test vectors are generated by the native reference implementation.
      - name: Build native reference implementation
        run: |
          cmake --preset release
          cmake --build --preset release-build --target argon2

      # Coverage of the library only, not of the test assemblies. VSTest 18 no
      # longer takes the collector's settings inline, so they go in a file.
      - name: Coverage settings
        run: |
          cat > coverage.runsettings <<'XML'
          <RunSettings>
            <DataCollectionRunSettings>
              <DataCollectors>
                <DataCollector friendlyName="XPlat code coverage">
                  <Configuration>
                    <Format>cobertura</Format>
                    <Include>[Isopoh.Cryptography.*]*</Include>
                  </Configuration>
                </DataCollector>
              </DataCollectors>
            </DataCollectionRunSettings>
          </RunSettings>
          XML

      # The whole managed suite except the memory leak test, which measures the
      # process and is meaningless (and slow) under the coverage collector.
      - name: Tests with coverage
        env:
          REFERENCE_RUN_PATH: ${{ github.workspace }}/Reference/bin/Release/argon2
        run: >
          dotnet test test/Isopoh.Cryptography.Test/Isopoh.Cryptography.Test.csproj
          -c Release -p:GeneratePackageOnBuild=false -p:UseSharedCompilation=false
          --filter "FullyQualifiedName!~TestLeaking"
          --collect:"XPlat Code Coverage" --settings coverage.runsettings
          --results-directory coverage

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/**/coverage.cobertura.xml
          flags: echophase
          fail_ci_if_error: false
