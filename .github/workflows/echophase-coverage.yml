name: Coverage (EchoPhase fork)

# Lives only on the echophase-ci branch, on top of the patch series in
# echophase, so that branch stays exactly the patches meant for upstream.
# Rebase this branch onto echophase after changing the patches.
#
# Each job covers code only its machine runs; Codecov merges the uploads of a
# commit: the AVX-512 path where the runner has it, AVX2 with AVX-512 turned
# off, the portable path with AVX2 off, and the Windows and macOS memory calls.
on:
  push:
    branches: [ echophase-ci ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Codecov upload with OIDC, no token

jobs:
  coverage:
    name: coverage (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, avx512: "1", avx2: "1" }
          - { name: linux-avx2, os: ubuntu-latest, avx512: "0", avx2: "1" }
          - { name: linux-portable, os: ubuntu-latest, avx512: "0", avx2: "0" }
          - { name: windows, os: windows-latest, avx512: "1", avx2: "1" }
          - { name: macos, os: macos-latest, avx512: "1", avx2: "1" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_EnableAVX512F: ${{ matrix.avx512 }}
      DOTNET_EnableAVX2: ${{ matrix.avx2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ninja

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # The test vectors are generated by the native reference implementation,
      # which the generator finds in the build output.
      - name: Build native reference implementation
        run: |
          cmake --preset release
          cmake --build --preset release-build --target argon2

      # Coverage of the library only, not of the test assemblies. VSTest 18 no
      # longer takes the collector's settings inline, so they go in a file.
      - name: Coverage settings
        shell: bash
        run: |
          cat > coverage.runsettings <<'XML'
          <RunSettings>
            <DataCollectionRunSettings>
              <DataCollectors>
                <DataCollector friendlyName="XPlat code coverage">
                  <Configuration>
                    <Format>cobertura</Format>
                    <Include>[Isopoh.Cryptography.*]*</Include>
                  </Configuration>
                </DataCollector>
              </DataCollectors>
            </DataCollectionRunSettings>
          </RunSettings>
          XML

      # The managed suite without the tests that measure rather than check,
      # and that coverage instrumentation (a counter on every line of the block
      # fill loops, ~40x slower) turns from seconds into tens of minutes:
      # LeakTests (process memory and the finalization queue), Category=Slow
      # (TestParallelismTiming, timings) and Category=HighMemory
      # (TestHighMemoryCost, hashes ~16 GiB twice; also more than a hosted
      # runner's RAM). The upstream CI and local runs still cover them.
      - name: Tests with coverage
        shell: bash
        run: >
          dotnet test test/Isopoh.Cryptography.Test/Isopoh.Cryptography.Test.csproj
          -c Release -p:GeneratePackageOnBuild=false -p:UseSharedCompilation=false
          --filter "FullyQualifiedName!~LeakTests&Category!=Slow&Category!=HighMemory"
          --collect:"XPlat Code Coverage" --settings coverage.runsettings
          --results-directory coverage

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/**/coverage.cobertura.xml
          flags: ${{ matrix.name }}
          fail_ci_if_error: false
